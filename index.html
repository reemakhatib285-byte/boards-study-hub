<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boards Study Hub — Reema</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--bg2:#0f1525;--card:#131929;--card2:#1a2235;--border:rgba(99,179,237,0.12);--border2:rgba(99,179,237,0.28);--accent:#63b3ed;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--ready:#48bb78;--ready-bg:rgba(72,187,120,0.1);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(99,179,237,0.05) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(79,209,197,0.04) 0%,transparent 50%);pointer-events:none;z-index:0;}
.container{max-width:860px;margin:0 auto;padding:0 24px 80px;position:relative;z-index:1;}
header{text-align:center;padding:60px 0 44px;}
.header-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(99,179,237,0.08);border:1px solid var(--border2);border-radius:100px;padding:6px 16px;font-family:'Space Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:22px;}
.header-badge::before{content:'';width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}
h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3rem);font-weight:400;}
h1 em{font-style:italic;color:var(--accent);}
.header-name{font-family:'Playfair Display',serif;font-size:1rem;color:var(--text2);margin-top:5px;}
.header-sub{font-family:'Space Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:0.06em;margin-top:10px;}
.stats{display:flex;justify-content:center;gap:14px;margin:28px 0 36px;flex-wrap:wrap;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 26px;text-align:center;min-width:105px;}
.stat-num{font-family:'Space Mono',monospace;font-size:1.7rem;font-weight:700;color:var(--accent);display:block;line-height:1;}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.12em;margin-top:5px;display:block;font-family:'Space Mono',monospace;}
.search-wrap{position:relative;margin-bottom:32px;}
.search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;}
#searchInput{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 15px 13px 42px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color 0.2s;}
#searchInput:focus{border-color:var(--border2);}
#searchInput::placeholder{color:var(--text3);}
.top-bar{display:flex;justify-content:flex-end;margin-bottom:10px;}
.btn-edit{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 16px;color:var(--text2);font-family:'Space Mono',monospace;font-size:11px;cursor:pointer;letter-spacing:0.06em;transition:border-color 0.2s,color 0.2s;}
.btn-edit:hover{border-color:var(--border2);color:var(--text);}
.btn-edit.active{border-color:var(--accent);color:var(--accent);}
.subject-card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;transition:border-color 0.2s;animation:fadeUp 0.35s ease both;}
.subject-card:hover{border-color:var(--border2);}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.subject-header{display:flex;align-items:center;gap:13px;padding:17px 18px;cursor:pointer;user-select:none;}
.subject-icon{width:38px;height:38px;background:var(--card2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.subject-name{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;flex:1;}
.topic-count{font-family:'Space Mono',monospace;font-size:10px;color:var(--accent);background:rgba(99,179,237,0.1);border:1px solid rgba(99,179,237,0.2);border-radius:6px;padding:3px 9px;letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;}
.chevron{color:var(--text3);transition:transform 0.25s;flex-shrink:0;}
.subject-card.open .chevron{transform:rotate(180deg);}
.topics-list{display:none;padding:0 18px 8px;border-top:1px solid var(--border);}
.subject-card.open .topics-list{display:block;}
.topic-row{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid rgba(99,179,237,0.05);border-radius:8px;cursor:pointer;transition:background 0.15s,padding-left 0.15s;text-decoration:none;}
.topic-row:last-of-type{border-bottom:none;}
.topic-row:hover{background:rgba(99,179,237,0.06);padding-left:10px;}
.topic-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;opacity:0.5;}
.topic-name{flex:1;font-size:14px;color:var(--text2);}
.topic-row:hover .topic-name{color:var(--text);}
.status-badge{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;flex-shrink:0;color:var(--ready);background:var(--ready-bg);border:1px solid rgba(72,187,120,0.2);}
.add-topic-form{display:none;padding:10px 4px 6px;border-top:1px solid var(--border);gap:8px;flex-wrap:wrap;align-items:center;}
.edit-mode .add-topic-form{display:flex;}
.add-topic-form input{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;flex:1;min-width:130px;transition:border-color 0.2s;}
.add-topic-form input:focus{border-color:var(--border2);}
.add-topic-form input::placeholder{color:var(--text3);}
.btn-add-topic{background:var(--accent);color:#0a0e1a;border:none;border-radius:8px;padding:8px 15px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity 0.15s;}
.btn-add-topic:hover{opacity:0.85;}
.topic-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:4px;opacity:0;transition:opacity 0.15s,color 0.15s;display:none;}
.edit-mode .topic-del{display:inline-block;}
.topic-row:hover .topic-del{opacity:1;}
.topic-del:hover{color:#fc8181;}
#addSubjectWrap{display:none;margin-top:14px;}
.edit-mode-active #addSubjectWrap{display:block;}
.btn-add-subject{width:100%;background:transparent;border:1.5px dashed var(--border2);border-radius:16px;padding:15px;color:var(--accent);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.08em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background 0.15s;}
.btn-add-subject:hover{background:rgba(99,179,237,0.05);}
.no-results{text-align:center;padding:48px;color:var(--text3);font-size:14px;display:none;}
footer{text-align:center;padding:40px 0 0;font-family:'Space Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:0.05em;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(5px);}
.modal-overlay.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:30px;width:90%;max-width:400px;}
.modal h3{font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:16px;}
.modal input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:11px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;margin-bottom:10px;transition:border-color 0.2s;}
.modal input:focus{border-color:var(--accent);}
.modal input::placeholder{color:var(--text3);}
.modal-btns{display:flex;gap:10px;margin-top:4px;}
.btn-confirm{flex:1;background:var(--accent);color:#0a0e1a;border:none;border-radius:10px;padding:11px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;}
.btn-confirm:hover{opacity:0.85;}
.btn-cancel{flex:1;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:10px;padding:11px;font-family:'Space Mono',monospace;font-size:12px;cursor:pointer;}
.pw-modal{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:30px;width:90%;max-width:360px;text-align:center;}
.pw-modal .lock{font-size:2rem;margin-bottom:10px;}
.pw-modal h3{font-family:'Playfair Display',serif;font-size:1.15rem;margin-bottom:6px;}
.pw-modal p{color:var(--text3);font-size:12px;margin-bottom:18px;font-family:'Space Mono',monospace;}
.pw-error{color:#fc8181;font-family:'Space Mono',monospace;font-size:11px;margin-bottom:8px;display:none;}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-badge">Stage א · Internal Medicine · 2026</div>
    <h1>Boards <em>Study Hub</em></h1>
    <p class="header-name">Reema</p>
    <p class="header-sub">All your guides, one place.</p>
  </header>
  <div class="stats">
    <div class="stat"><span class="stat-num" id="totalGuides">14</span><span class="stat-label">Guides Ready</span></div>
    <div class="stat"><span class="stat-num" id="totalSubjects">5</span><span class="stat-label">Subjects</span></div>
    <div class="stat"><span class="stat-num">A</span><span class="stat-label">Stage</span></div>
  </div>
  <div class="search-wrap">
    <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search subjects or topics...">
  </div>
  <div class="top-bar">
    <button class="btn-edit" id="editBtn" onclick="onEditClick()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Edit
    </button>
  </div>
  <div id="subjectsContainer"></div>
  <div id="addSubjectWrap"><button class="btn-add-subject" onclick="openAddSubject()">+ Add New Subject</button></div>
  <div class="no-results" id="noResults">No topics found.</div>
  <footer>Boards Study Hub · Stage A Internal Medicine · 2026</footer>
</div>

<!-- PW Modal -->
<div class="modal-overlay" id="pwModal">
  <div class="pw-modal">
    <div class="lock">🔒</div>
    <h3>Edit Mode</h3>
    <p>Enter your password to unlock.</p>
    <input type="password" id="pwInput" placeholder="Password..." onkeydown="if(event.key==='Enter')checkPw()">
    <p class="pw-error" id="pwError">Incorrect password.</p>
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal('pwModal')">Cancel</button><button class="btn-confirm" onclick="checkPw()">Unlock</button></div>
  </div>
</div>

<!-- Add Subject Modal -->
<div class="modal-overlay" id="addSubjectModal">
  <div class="modal">
    <h3>New Subject</h3>
    <input type="text" id="newSubjectName" placeholder="Subject name (e.g. Cardiology)">
    <input type="text" id="newSubjectIcon" placeholder="Emoji icon (e.g. ❤️)">
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal('addSubjectModal')">Cancel</button><button class="btn-confirm" onclick="confirmAddSubject()">Add</button></div>
  </div>
</div>

<script>
const PASS = 'reema2026';

const DEFAULT = [{"id":"hepatology","name":"Hepatology","icon":"🫀","topics":[{"name":"Liver Disease","file":"liver_disease_boards_guide.html","status":"ready"},{"name":"Alcoholic Liver Disease","file":"ALD_boards_guide.html","status":"ready"},{"name":"MASLD / MASH","file":"MASLD_boards_guide.html","status":"ready"},{"name":"Toxic & Drug-Induced Hepatitis","file":"toxic_drug_induced_hepatitis_boards_guide.html","status":"ready"}]},{"id":"nephrology","name":"Nephrology","icon":"🫘","topics":[{"name":"Acute Kidney Injury (AKI)","file":"AKI_boards_guide.html","status":"ready"},{"name":"Chronic Kidney Disease (CKD)","file":"CKD_boards_guide.html","status":"ready"},{"name":"Azotemia & Urinary Abnormalities","file":"azotemia_urinary_abnormalities_boards_guide.html","status":"ready"},{"name":"Acid-Base Disorders","file":"acid_base_boards_guide_LAST.html","status":"ready"}]},{"id":"cardiology","name":"Cardiology","icon":"❤️","topics":[{"name":"Hypertension","file":"Hypertension_boards_guide.html","status":"ready"},{"name":"Stable Angina","file":"Stable_Angina_Boards_Guide.html","status":"ready"},{"name":"NSTEMI / NSTE-ACS","file":"NSTEMI_boards_guide.html","status":"ready"},{"name":"STEMI","file":"STEMI_boards_guide_final.html","status":"ready"},{"name":"Pericardial Disease","file":"pericardial_disease_boards_guide.html","status":"ready"},{"name":"Pericardial Sketches","file":"pericardial_sketches.html","status":"ready"}]},{"id":"rheumatology","name":"Rheumatology","icon":"🦴","topics":[{"name":"SLE","file":"SLE_Boards_Study_Guide.html","status":"ready"},{"name":"APS","file":"APS_Boards_Study_Guide.html","status":"ready"},{"name":"Gout","file":"gout_boards_guide.html","status":"ready"}]},{"id":"resources","name":"Study Tools","icon":"📋","topics":[{"name":"Study Checklist","file":"checklist.html","status":"ready"}]}];

let data = loadData();
let editMode = false;
let openSubjects = new Set(['hepatology']);

function loadData() {
  try {
    const s = localStorage.getItem('reema_hub_v4');
    if (s) {
      const p = JSON.parse(s);
      if (p && Array.isArray(p) && p.length > 0) return p;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT));
}

function save() {
  localStorage.setItem('reema_hub_v4', JSON.stringify(data));
}

function render(filter='') {
  const container = document.getElementById('subjectsContainer');
  container.innerHTML = '';
  container.className = editMode ? 'edit-mode' : '';
  document.getElementById('addSubjectWrap').className = editMode ? 'edit-mode-active' : '';
  let visible = 0, totalGuides = 0;

  data.forEach((subj, si) => {
    const filtered = filter ? subj.topics.filter(t => t.name.toLowerCase().includes(filter.toLowerCase())) : subj.topics;
    if (filter && filtered.length === 0) return;
    visible++;
    totalGuides += subj.topics.length;
    const isOpen = openSubjects.has(subj.id) || (filter && filtered.length > 0);
    const card = document.createElement('div');
    card.className = `subject-card${isOpen?' open':''}`;
    card.style.animationDelay = `${si*0.04}s`;
    card.innerHTML = `
      <div class="subject-header" onclick="toggleSubject('${subj.id}',event)">
        <div class="subject-icon">${subj.icon}</div>
        <span class="subject-name">${subj.name}</span>
        <span class="topic-count">${subj.topics.length} TOPIC${subj.topics.length!==1?'S':''}</span>
        <svg class="chevron" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="topics-list">
        ${filtered.map((t,ti) => `
          <a class="topic-row" href="${t.file}" target="_blank">
            <div class="topic-dot"></div>
            <span class="topic-name">${t.name}</span>
            <span class="status-badge">READY</span>
            <button class="topic-del" onclick="delTopic(${si},${subj.topics.indexOf(t)},event)">✕</button>
          </a>`).join('')}
        <div class="add-topic-form">
          <input type="text" id="tn_${si}" placeholder="Topic name">
          <input type="text" id="tf_${si}" placeholder="filename.html">
          <button class="btn-add-topic" onclick="addTopic(${si})">+ ADD</button>
        </div>
      </div>`;
    container.appendChild(card);
  });

  document.getElementById('totalGuides').textContent = totalGuides;
  document.getElementById('totalSubjects').textContent = data.length;
  document.getElementById('noResults').style.display = (filter && visible===0) ? 'block' : 'none';
}

function toggleSubject(id, e) {
  if (e.target.closest('.topic-del,.btn-add-topic,.add-topic-form')) return;
  openSubjects.has(id) ? openSubjects.delete(id) : openSubjects.add(id);
  render(document.getElementById('searchInput').value);
}

function addTopic(si) {
  const name = document.getElementById('tn_'+si).value.trim();
  const file = document.getElementById('tf_'+si).value.trim();
  if (!name) return;
  data[si].topics.push({name, file: file||'', status:'ready'});
  openSubjects.add(data[si].id);
  save(); render();
}

function delTopic(si, ti, e) {
  e.preventDefault(); e.stopPropagation();
  if (!confirm(`Delete "${data[si].topics[ti].name}"?`)) return;
  data[si].topics.splice(ti,1);
  save(); render();
}

function onEditClick() {
  if (!editMode) {
    document.getElementById('pwModal').classList.add('show');
    document.getElementById('pwInput').value='';
    document.getElementById('pwError').style.display='none';
    setTimeout(()=>document.getElementById('pwInput').focus(),100);
  } else {
    editMode=false;
    document.getElementById('editBtn').classList.remove('active');
    document.getElementById('editBtn').innerHTML=`<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit`;
    render(document.getElementById('searchInput').value);
  }
}

function checkPw() {
  if (document.getElementById('pwInput').value===PASS) {
    closeModal('pwModal'); editMode=true;
    document.getElementById('editBtn').classList.add('active');
    document.getElementById('editBtn').innerHTML=`<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Done`;
    render(document.getElementById('searchInput').value);
  } else {
    document.getElementById('pwError').style.display='block';
    document.getElementById('pwInput').value='';
    document.getElementById('pwInput').focus();
  }
}

function openAddSubject() {
  document.getElementById('newSubjectName').value='';
  document.getElementById('newSubjectIcon').value='';
  document.getElementById('addSubjectModal').classList.add('show');
  setTimeout(()=>document.getElementById('newSubjectName').focus(),100);
}

function confirmAddSubject() {
  const name=document.getElementById('newSubjectName').value.trim();
  const icon=document.getElementById('newSubjectIcon').value.trim()||'📚';
  if (!name) return;
  const id='subj_'+Date.now();
  data.push({id,name,icon,topics:[]});
  openSubjects.add(id);
  save(); closeModal('addSubjectModal'); render();
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }

['pwModal','addSubjectModal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal(id);});
});

document.getElementById('searchInput').addEventListener('input',function(){render(this.value.trim());});

render();
</script>
</body>
</html>
